<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Share a Moment</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #F6F1EA;
    color: #2A211C;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 28px; max-width: 480px; margin: 0 auto; width: 100%; }
  h1 { font-family: 'Great Vibes', cursive; font-weight: 400; font-size: 42px; margin: 0 0 6px; text-align: center; line-height: 1; }
  h1.small { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 26px; }
  p.sub { color: #5C524B; text-align: center; margin: 0 0 22px; font-size: 13px; line-height: 1.5; }
  label {
    display: block; font: 600 11px/1 'DM Sans', sans-serif; letter-spacing: 0.12em; text-transform: uppercase;
    color: #857870; margin-bottom: 8px;
  }
  input[type="text"], textarea {
    width: 100%; padding: 14px 16px; border-radius: 16px; border: none;
    background: #FFFFFF; box-shadow: 0 6px 18px rgba(42,33,28,0.06); color: #2A211C; font-size: 15px;
    font-family: 'DM Sans', sans-serif; margin-bottom: 18px; resize: none;
  }
  input[type="text"] { height: 50px; }
  textarea { min-height: 84px; line-height: 1.45; }
  input::placeholder, textarea::placeholder { color: #A39790; }
  button {
    width: 100%; padding: 0; height: 56px; border-radius: 999px; border: none;
    font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; margin-top: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-primary { background: #2A211C; color: #F6F1EA; box-shadow: 0 14px 30px rgba(42,33,28,0.22); }
  .btn-secondary { background: #FFFFFF; color: #2A211C; box-shadow: 0 8px 20px rgba(42,33,28,0.08); }
  .btn-primary:disabled { background: #D7CFC7; color: #fff; box-shadow: none; }
  .preview { width: 100%; border-radius: 20px; background: #1A1512; aspect-ratio: 3/4; object-fit: cover; margin-bottom: 18px; display: block; }
  .picker {
    display: flex; gap: 12px; margin-bottom: 8px;
  }
  .picker button { margin-top: 0; flex: 1; height: 112px; flex-direction: column; gap: 8px; font-size: 14px; }
  .picker .glyph { font-size: 24px; }
  .note {
    background: #F5E9D3; color: #7A5A24; border-radius: 16px; padding: 12px 16px;
    font-size: 12.5px; line-height: 1.5; margin-bottom: 18px;
  }
  .error { color: #B9695E; text-align: center; margin-top: 12px; font-size: 14px; }
  .center { text-align: center; padding: 20px; }
  .center .emoji { font-size: 48px; margin-bottom: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <!-- Name first, same as the video guestbook and photo pages, so the couple
       always knows who a moment came from. -->
  <div id="screen-name">
    <h1>Share a moment</h1>
    <p class="sub">Send the couple a photo or a short video from your side of the day.</p>
    <label for="guestName">Your name</label>
    <input type="text" id="guestName" placeholder="e.g. Sofia" maxlength="60" />
    <button class="btn-primary" id="btnStart">Continue</button>
  </div>

  <!-- One upload per submission, matching the existing guest flows — there's
       deliberately no camera-roll bulk import here. -->
  <div id="screen-pick" class="hidden">
    <h1 class="small">What would you like to share?</h1>
    <p class="sub">One moment at a time.</p>
    <div class="picker">
      <button type="button" class="btn-secondary" id="btnPhoto">
        <span class="glyph">📷</span>
        <span>Photo</span>
      </button>
      <button type="button" class="btn-secondary" id="btnVideo">
        <span class="glyph">🎥</span>
        <span>Video</span>
      </button>
    </div>
  </div>

  <div id="screen-details" class="hidden">
    <h1 class="small">Add a note</h1>
    <img id="previewImage" class="preview hidden" alt="Your moment" />
    <video id="previewVideo" class="preview hidden" playsinline muted></video>

    <label for="caption">Caption (optional)</label>
    <textarea id="caption" placeholder="What was happening?" maxlength="280"></textarea>

    <div class="note">The couple reviews everything guests send before it joins their album.</div>

    <button class="btn-primary" id="btnSubmit">Send to the couple</button>
    <button class="btn-secondary" id="btnRetake">Pick something else</button>
    <div class="error hidden" id="submitError"></div>
  </div>

  <div id="screen-done" class="hidden center">
    <div class="emoji">💛</div>
    <h1>Thank you!</h1>
    <p class="sub">Your moment is on its way to the couple.</p>
    <button class="btn-secondary" id="btnAnother">Share another</button>
  </div>
</div>

<input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none" />
<input type="file" accept="video/*" capture="environment" id="videoInput" style="display:none" />

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://zqkkfnhwuudqioccyvwn.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpxa2tmbmh3dXVkcWlvY2N5dnduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMDgzOTYsImV4cCI6MjEwMDg4NDM5Nn0.5a-v9k1I9GYU9HyjDjvh66YCG7OX-IxOh79zV1e3UC8';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Identifies which couple this QR code belongs to — the same `w` param the
  // guestbook and photo pages use. Without it a submission can't be scoped to
  // a wedding, so it would never reach anyone.
  const weddingId = new URLSearchParams(window.location.search).get('w') || null;

  // Guest uploads are capped well below the app's own limit: a wedding guest
  // on venue wi-fi shouldn't be pushing a 300MB clip.
  const MAX_BYTES = 60 * 1024 * 1024;

  const screens = {
    name: document.getElementById('screen-name'),
    pick: document.getElementById('screen-pick'),
    details: document.getElementById('screen-details'),
    done: document.getElementById('screen-done'),
  };
  function showScreen(name) {
    Object.values(screens).forEach((el) => el.classList.add('hidden'));
    screens[name].classList.remove('hidden');
  }

  const guestNameInput = document.getElementById('guestName');
  const captionInput = document.getElementById('caption');
  const previewImage = document.getElementById('previewImage');
  const previewVideo = document.getElementById('previewVideo');
  const submitError = document.getElementById('submitError');
  const photoInput = document.getElementById('photoInput');
  const videoInput = document.getElementById('videoInput');
  const btnSubmit = document.getElementById('btnSubmit');

  let guestName = '';
  let pickedFile = null;
  let pickedType = null; // 'photo' | 'video'
  let previewUrl = null;

  document.getElementById('btnStart').addEventListener('click', () => {
    guestName = guestNameInput.value.trim() || 'A guest';
    showScreen('pick');
  });

  document.getElementById('btnPhoto').addEventListener('click', () => photoInput.click());
  document.getElementById('btnVideo').addEventListener('click', () => videoInput.click());

  photoInput.addEventListener('change', () => handlePicked(photoInput, 'photo'));
  videoInput.addEventListener('change', () => handlePicked(videoInput, 'video'));

  function handlePicked(input, type) {
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;

    if (file.size > MAX_BYTES) {
      showScreen('pick');
      alert('That file is a bit too large to send — try a shorter video or a single photo.');
      return;
    }

    releasePreview();
    pickedFile = file;
    pickedType = type;
    previewUrl = URL.createObjectURL(file);

    previewImage.classList.toggle('hidden', type !== 'photo');
    previewVideo.classList.toggle('hidden', type !== 'video');
    if (type === 'photo') {
      previewImage.src = previewUrl;
    } else {
      previewVideo.src = previewUrl;
      previewVideo.load();
    }

    submitError.classList.add('hidden');
    showScreen('details');
  }

  function releasePreview() {
    if (previewUrl) {
      URL.revokeObjectURL(previewUrl);
      previewUrl = null;
    }
  }

  document.getElementById('btnRetake').addEventListener('click', () => {
    releasePreview();
    pickedFile = null;
    pickedType = null;
    showScreen('pick');
  });

  document.getElementById('btnAnother').addEventListener('click', () => {
    captionInput.value = '';
    showScreen('pick');
  });

  btnSubmit.addEventListener('click', async () => {
    if (!pickedFile || !pickedType) return;
    btnSubmit.disabled = true;
    btnSubmit.textContent = 'Sending…';
    submitError.classList.add('hidden');

    try {
      const id = crypto.randomUUID();
      const extension = guessExtension(pickedFile, pickedType);
      // Same {wedding}/{id}.{ext} layout the app uses, so one bucket policy
      // covers both couple captures and guest submissions.
      const path = `${weddingId || 'unscoped'}/${id}.${extension}`;

      const { error: uploadError } = await supabase.storage
        .from('memories')
        .upload(path, pickedFile, { contentType: pickedFile.type || undefined });
      if (uploadError) throw uploadError;

      const { error: insertError } = await supabase.from('memories').insert({
        id,
        wedding_id: weddingId,
        type: pickedType,
        storage_path: path,
        caption: captionInput.value.trim() || null,
        privacy: 'shareable',
        source: 'guest',
        guest_name: guestName,
        // Always pending: nothing a guest sends shows up in the couple's
        // timeline until they've approved it in the app.
        moderation_status: 'pending',
        captured_at: new Date().toISOString(),
      });
      if (insertError) throw insertError;

      releasePreview();
      pickedFile = null;
      pickedType = null;
      showScreen('done');
    } catch (err) {
      console.error('Moment submit failed', err);
      const detail = (err && (err.message || err.error_description || err.statusText)) || '';
      submitError.textContent = detail ? `Could not send: ${detail}` : 'Could not send — check your connection and try again.';
      submitError.classList.remove('hidden');
    } finally {
      btnSubmit.disabled = false;
      btnSubmit.textContent = 'Send to the couple';
    }
  });

  function guessExtension(file, type) {
    const fromName = (file.name || '').split('.').pop();
    if (fromName && fromName.length <= 4 && /^[a-z0-9]+$/i.test(fromName)) return fromName.toLowerCase();
    const fromMime = (file.type || '').split('/')[1];
    if (fromMime && /^[a-z0-9]+$/i.test(fromMime)) return fromMime.toLowerCase();
    return type === 'photo' ? 'jpg' : 'mp4';
  }
</script>
</body>
</html>
