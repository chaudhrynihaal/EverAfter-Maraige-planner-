<!doctype html>
<html lang="en">
<head>
<!-- build: force-redeploy-1 -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Leave a Video Message</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet" />
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #F6F1EA;
    color: #2A211C;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 28px; max-width: 480px; margin: 0 auto; width: 100%; }
  h1 { font-family: 'Great Vibes', cursive; font-weight: 400; font-size: 46px; margin: 0 0 6px; text-align: center; line-height: 1; }
  h1.small { font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 26px; }
  p.sub { color: #5C524B; text-align: center; margin: 0 0 28px; font-size: 14px; line-height: 1.5; }
  video { width: 100%; border-radius: 20px; background: #1A1512; aspect-ratio: 3/4; object-fit: cover; transition: transform 0.15s; }
  video.mirrored { transform: scaleX(-1); }
  label {
    display: block; font: 600 11px/1 'DM Sans', sans-serif; letter-spacing: 0.12em; text-transform: uppercase;
    color: #857870; margin-bottom: 8px;
  }
  input[type="text"] {
    width: 100%; padding: 14px 16px; height: 50px; border-radius: 16px; border: none;
    background: #FFFFFF; box-shadow: 0 6px 18px rgba(42,33,28,0.06); color: #2A211C; font-size: 15px;
    font-family: 'DM Sans', sans-serif; margin-bottom: 18px;
  }
  input[type="text"]::placeholder { color: #A39790; }
  button {
    width: 100%; padding: 0; height: 56px; border-radius: 999px; border: none;
    font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; margin-top: 10px; cursor: pointer;
  }
  .btn-primary { background: #2A211C; color: #F6F1EA; box-shadow: 0 14px 30px rgba(42,33,28,0.22); }
  .btn-secondary { background: #FFFFFF; color: #2A211C; box-shadow: 0 8px 20px rgba(42,33,28,0.08); }
  .btn-record { background: #E5484D; color: #fff; box-shadow: 0 14px 30px rgba(229,72,77,0.3); }
  button:disabled { opacity: 0.5; }
  .record-dot {
    position: absolute; top: 24px; left: 28px; width: 8px; height: 8px; z-index: 1;
    border-radius: 50%; background: #E5484D; animation: pulse 1s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .video-wrap { position: relative; margin-bottom: 14px; }
  .timer {
    position: absolute; top: 16px; left: 16px; background: rgba(0,0,0,0.45);
    padding: 6px 12px 6px 22px; border-radius: 999px; font-size: 13px; font-weight: 500; color: #fff;
  }
  .flip-btn {
    position: absolute; bottom: 12px; right: 12px; width: auto; height: 34px;
    background: rgba(0,0,0,0.45); color: #fff; border-radius: 999px;
    padding: 0 14px; font-size: 12px; font-weight: 500; margin: 0;
    display: flex; align-items: center; gap: 6px;
  }
  /* Switches which physical camera (front/back) is recording — distinct
     from "Flip view", which only mirrors how the current camera previews. */
  .switch-cam-btn {
    position: absolute; top: 12px; right: 12px; width: 38px; height: 38px;
    background: rgba(0,0,0,0.45); color: #fff; border-radius: 50%;
    padding: 0; margin: 0; font-size: 18px;
    display: flex; align-items: center; justify-content: center;
  }
  /* Custom play/pause for the review video instead of the browser's native
     controls attribute — with the mirror transform applied straight to the
     <video>, native controls would mirror right along with it (play
     triangle pointing the wrong way, scrubber reversed). */
  .play-overlay {
    position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: auto; height: auto;
    margin: 0; padding: 0; background: transparent; border-radius: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .play-overlay .dot {
    width: 56px; height: 56px; border-radius: 50%; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
  }
  .center { text-align: center; padding: 20px; }
  .center .emoji { font-size: 48px; margin-bottom: 12px; }
  .error { color: #B9695E; text-align: center; margin-top: 12px; font-size: 14px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div id="screen-name">
    <h1>Leave a message</h1>
    <p class="sub">Record a video for the happy couple — no app needed, up to a minute.</p>
    <label for="guestName">Your name</label>
    <input type="text" id="guestName" placeholder="e.g. Grandma June" maxlength="60" />
    <button class="btn-primary" id="btnToCamera">Continue</button>
    <!-- Carries the same ?w= wedding scope across to the moment page, so a
         guest who followed one QR doesn't lose which wedding they're at. -->
    <button type="button" class="btn-secondary" id="btnShareMoment">Or share a photo instead</button>
  </div>

  <div id="screen-record" class="hidden">
    <h1 class="small">Say hello</h1>
    <div class="video-wrap">
      <video id="preview" autoplay muted playsinline></video>
      <div class="timer hidden" id="timer">1:00</div>
      <div class="record-dot hidden" id="recordDot"></div>
      <button type="button" class="switch-cam-btn" id="btnSwitchCamera" aria-label="Switch camera">🔄</button>
      <button type="button" class="flip-btn" id="btnFlip">⇋ Flip view</button>
    </div>
    <button class="btn-record" id="btnRecord">Start Recording</button>
    <div class="error hidden" id="camError"></div>
  </div>

  <div id="screen-review" class="hidden">
    <h1 class="small">Review your message</h1>
    <div class="video-wrap">
      <video id="reviewVideo" playsinline></video>
      <button type="button" class="play-overlay" id="btnPlayPause" aria-label="Play or pause">
        <span class="dot">
          <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
        </span>
      </button>
    </div>
    <button class="btn-primary" id="btnSubmit">Submit Message</button>
    <button class="btn-secondary" id="btnRetake">Retake</button>
    <div class="error hidden" id="submitError"></div>
  </div>

  <div id="screen-done" class="hidden center">
    <div class="emoji">🎉</div>
    <h1>Thank you!</h1>
    <p class="sub">Your message has been saved.</p>
    <button class="btn-secondary" id="btnAnother">Record Another</button>
  </div>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  // Same project the EverAfter app reads from — filled in at deploy time.
  const SUPABASE_URL = 'https://zqkkfnhwuudqioccyvwn.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpxa2tmbmh3dXVkcWlvY2N5dnduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMDgzOTYsImV4cCI6MjEwMDg4NDM5Nn0.5a-v9k1I9GYU9HyjDjvh66YCG7OX-IxOh79zV1e3UC8';
  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Identifies which couple this page's QR code belongs to — without it,
  // every couple's guests would upload into the same shared table and every
  // couple's app would read every other couple's submissions back.
  const weddingId = new URLSearchParams(window.location.search).get('w') || null;

  const MAX_SECONDS = 60;

  const screens = {
    name: document.getElementById('screen-name'),
    record: document.getElementById('screen-record'),
    review: document.getElementById('screen-review'),
    done: document.getElementById('screen-done'),
  };
  function showScreen(name) {
    Object.values(screens).forEach((el) => el.classList.add('hidden'));
    screens[name].classList.remove('hidden');
  }

  const guestNameInput = document.getElementById('guestName');
  const preview = document.getElementById('preview');
  const reviewVideo = document.getElementById('reviewVideo');
  const timerEl = document.getElementById('timer');
  const recordDot = document.getElementById('recordDot');
  const camError = document.getElementById('camError');
  const submitError = document.getElementById('submitError');
  const btnFlip = document.getElementById('btnFlip');
  const btnSwitchCamera = document.getElementById('btnSwitchCamera');
  const btnPlayPause = document.getElementById('btnPlayPause');

  btnPlayPause.addEventListener('click', () => {
    if (reviewVideo.paused || reviewVideo.ended) reviewVideo.play();
    else reviewVideo.pause();
  });
  reviewVideo.addEventListener('play', () => btnPlayPause.classList.add('hidden'));
  reviewVideo.addEventListener('pause', () => btnPlayPause.classList.remove('hidden'));
  reviewVideo.addEventListener('ended', () => btnPlayPause.classList.remove('hidden'));

  let stream = null;
  let mediaRecorder = null;
  let chunks = [];
  let recording = false;
  let startedAt = 0;
  let timerInterval = null;
  let recordedBlob = null;
  let recordedSeconds = 0;
  let mimeType = 'video/mp4';
  // Whether a phone's front camera delivers an already-mirrored or a true
  // (unmirrored) stream is inconsistent across devices — there's no reliable
  // way to detect it automatically. So instead of guessing, the guest can
  // flip this themselves until the on-screen preview looks right; the CSS
  // is applied to both the live preview and the review playback (kept in
  // sync), and the same choice is saved alongside the video so the
  // EverAfter app can play it back mirrored the same way.
  let mirrored = true;
  // 'user' = front/selfie camera, 'environment' = back camera. Distinct
  // from `mirrored` above — this actually swaps which physical camera is
  // recording, not just how the preview is displayed.
  let facingMode = 'user';

  function applyMirrorClass() {
    preview.classList.toggle('mirrored', mirrored);
    reviewVideo.classList.toggle('mirrored', mirrored);
  }
  applyMirrorClass();

  btnFlip.addEventListener('click', () => {
    mirrored = !mirrored;
    applyMirrorClass();
  });

  // Throws on failure — callers decide how to handle it (initial open shows
  // an error message; switching cameras falls back to the previous camera).
  async function acquireCameraStream() {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode },
      audio: true,
    });
    preview.srcObject = stream;
  }

  async function openCamera() {
    try {
      await acquireCameraStream();
    } catch (err) {
      camError.textContent = 'Could not access camera/microphone. Please allow access and reload the page.';
      camError.classList.remove('hidden');
    }
  }

  btnSwitchCamera.addEventListener('click', async () => {
    if (recording) return; // switching mid-recording would restart the capture session
    const previousFacingMode = facingMode;
    facingMode = facingMode === 'user' ? 'environment' : 'user';
    if (stream) stream.getTracks().forEach((t) => t.stop());
    try {
      await acquireCameraStream();
    } catch (err) {
      facingMode = previousFacingMode; // most likely this device only has one camera
      await openCamera();
    }
  });

  document.getElementById('btnToCamera').addEventListener('click', () => {
    showScreen('record');
    openCamera();
  });

  document.getElementById('btnShareMoment').addEventListener('click', () => {
    window.location.href = weddingId ? `moment.html?w=${encodeURIComponent(weddingId)}` : 'moment.html';
  });

  function pickMimeType() {
    const candidates = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm'];
    for (const c of candidates) {
      if (window.MediaRecorder && MediaRecorder.isTypeSupported(c)) return c;
    }
    return '';
  }

  document.getElementById('btnRecord').addEventListener('click', () => {
    if (recording) {
      mediaRecorder.stop();
      return;
    }
    if (!stream) return;
    chunks = [];
    mimeType = pickMimeType();
    mediaRecorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
    mediaRecorder.onstop = () => {
      recording = false;
      recordDot.classList.add('hidden');
      timerEl.classList.add('hidden');
      clearInterval(timerInterval);
      recordedSeconds = Math.round((Date.now() - startedAt) / 1000);
      recordedBlob = new Blob(chunks, { type: mimeType || 'video/mp4' });
      reviewVideo.src = URL.createObjectURL(recordedBlob);
      btnPlayPause.classList.remove('hidden'); // fresh source always starts paused
      stream.getTracks().forEach((t) => t.stop());
      showScreen('review');
    };
    mediaRecorder.start();
    recording = true;
    startedAt = Date.now();
    document.getElementById('btnRecord').textContent = 'Stop Recording';
    recordDot.classList.remove('hidden');
    timerEl.classList.remove('hidden');
    btnSwitchCamera.classList.add('hidden');
    let elapsed = 0;
    const mm = Math.floor(MAX_SECONDS / 60);
    const ss = MAX_SECONDS % 60;
    timerEl.textContent = `${mm}:${String(ss).padStart(2, '0')}`;
    timerInterval = setInterval(() => {
      elapsed += 1;
      const remaining = Math.max(MAX_SECONDS - elapsed, 0);
      const rm = Math.floor(remaining / 60);
      const rs = remaining % 60;
      timerEl.textContent = `${rm}:${String(rs).padStart(2, '0')}`;
      if (remaining <= 0) mediaRecorder.stop();
    }, 1000);
  });

  document.getElementById('btnRetake').addEventListener('click', () => {
    submitError.classList.add('hidden');
    document.getElementById('btnRecord').textContent = 'Start Recording';
    btnSwitchCamera.classList.remove('hidden');
    showScreen('record');
    openCamera();
  });

  document.getElementById('btnSubmit').addEventListener('click', async () => {
    const btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.textContent = 'Uploading…';
    submitError.classList.add('hidden');
    try {
      const ext = (mimeType || 'video/mp4').includes('webm') ? 'webm' : 'mp4';
      const path = `${crypto.randomUUID()}.${ext}`;
      const { error: uploadError } = await supabase.storage
        .from('guestbook-videos')
        .upload(path, recordedBlob, { contentType: mimeType || 'video/mp4' });
      if (uploadError) throw uploadError;

      const guestName = guestNameInput.value.trim() || 'A guest';
      const { error: insertError } = await supabase.from('guestbook_submissions').insert({
        guest_name: guestName,
        video_path: path,
        duration_seconds: recordedSeconds,
        mirrored,
        wedding_id: weddingId,
      });
      if (insertError) throw insertError;

      showScreen('done');
    } catch (err) {
      console.error('Guestbook submit failed', err);
      const detail = (err && (err.message || err.error_description || err.statusText)) || '';
      submitError.textContent = detail
        ? `Could not submit: ${detail}`
        : 'Could not submit — check your connection and try again.';
      submitError.classList.remove('hidden');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit Message';
    }
  });

  document.getElementById('btnAnother').addEventListener('click', () => {
    recordedBlob = null;
    guestNameInput.value = '';
    showScreen('name');
  });
</script>
</body>
</html>
